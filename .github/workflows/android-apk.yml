name: Android APK 构建

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# 保留 concurrency，但 cancel-in-progress 关闭：
# 之前 fork 账号（免费 tier）一有并发的 workflow 排队，旧任务就被 cancel-in-progress 干掉，
# 导致永远 queued→cancelled。关掉它让后续构建排队等待而不是取消。
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    name: 打包 Debug APK (arm64)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install NDK 30.0.15729638 & CMake 3.22.1
        run: |
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMGR" ] || SDKMGR="$ANDROID_HOME/tools/bin/sdkmanager"
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" --install "ndk;30.0.15729638" "cmake;3.22.1" "platforms;android-37" "build-tools;37.0.0" | tail -1

      - name: Prepare PRoot ARM64 runtime
        run: |
          bash tools/prepare-proot-runtime.sh
          ls -la app/src/main/jniLibs/arm64-v8a/ | grep -E "libproot" || true

      - name: Rebuild libpty_native.so from source (JNI symbols must match current package)
        run: |
          set -euo pipefail
          NDK_VER="30.0.15729638"
          NDK="$ANDROID_HOME/ndk/$NDK_VER"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$ANDROID_HOME/tools/bin/sdkmanager"
          if [ ! -x "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang" ]; then
            echo "NDK $NDK_VER 不存在，先安装…"
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" --install "ndk;$NDK_VER" 2>&1 | tail -3
          fi
          HOST_TAG="$(ls "$NDK/toolchains/llvm/prebuilt" 2>/dev/null | head -1)"
          [ -n "$HOST_TAG" ] || { echo "!! NDK 目录为空: $NDK/toolchains/llvm/prebuilt"; exit 1; }
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/$HOST_TAG"
          CC="$TOOLCHAIN/bin/aarch64-linux-android30-clang"
          [ -x "$CC" ] || { echo "!! clang 不存在: $CC"; exit 1; }
          SRC="app/src/main/cpp/pty_native.c"
          OUT="app/src/main/jniLibs/arm64-v8a/libpty_native.so"
          echo "  CC  : $CC"
          "$CC" -shared -fPIC -O2 -Wall -Werror=implicit-function-declaration -o "$OUT" "$SRC"
          ls -la "$OUT"
          # JNI 符号必须与当前包名一致，否则运行时 UnsatisfiedLinkError
          if ! nm -D --defined-only "$OUT" | grep -q "Java_top_tianyan_app_runtime_pty_NativePty_openAndExec"; then
            echo "!! 重建后的 .so 未导出 top_tianyan JNI 符号"; nm -D --defined-only "$OUT" | head -20; exit 1
          fi
          if nm -D --defined-only "$OUT" | grep -q "top_wanxiang"; then
            echo "!! 重建后的 .so 仍含旧包名符号"; exit 1
          fi
          if strings "$OUT" | grep -qi "wanxiang"; then
            echo "!! 重建后的 .so 仍含旧品牌字符串"; exit 1
          fi
          echo "  JNI 符号与品牌串校验通过"

      - name: Require release signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 || secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD || secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS || secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD || secrets.RELEASE_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          for value in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!value:-}" ]; then
              echo "::error::Missing release signing secret: $value"
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "TIANYAN_RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "TIANYAN_RELEASE_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "TIANYAN_RELEASE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "TIANYAN_RELEASE_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

      - name: Build signed Android APK
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleDebug --console=plain --no-daemon

      - name: Verify signed Android APK
        run: |
          set -euo pipefail
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          [ -f "$APK_PATH" ] || { echo "::error::No debug APK generated"; exit 1; }
          "$ANDROID_HOME/build-tools/37.0.0/zipalign" -c -P 16 -v 4 "$APK_PATH"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs "$APK_PATH" | tee /tmp/apk-signature.txt
          grep -q 'certificate SHA-256 digest: a391e0f58385b4691c643b52d34f58032e60ddeb3439b44552beee38f2c705da' /tmp/apk-signature.txt
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$APK_PATH" | grep -q "package: name='top.tianyan.app.debug'"
          mkdir -p output
          cp "$APK_PATH" output/tianyan-v0.14.0-debug.apk
          sha256sum output/tianyan-v0.14.0-debug.apk > output/tianyan-v0.14.0-debug.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tianyan-release-apk-${{ github.ref_name }}
          path: output/*
          if-no-files-found: error
          retention-days: 90

      - name: Attach APK to Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: output/tianyan-v0.14.0-debug.apk output/tianyan-v0.14.0-debug.apk.sha256
          append_body: true

  # 单元测试此前从未在 CI 里跑过——仓库有 800+ 个测试，但没有任何 workflow 执行它们，
  # 于是 harness 模块的测试代码在接口变更后编译不过很久都没人发现。
  # 与 apk 任务并行，且不需要 NDK：preBuild 只在真正打包 APK 时才要求 libpty_native.so。
  test:
    name: 单元测试
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Run unit tests
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --console=plain --no-daemon --continue

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports-${{ github.ref_name }}
          path: "**/build/reports/tests/testDebugUnitTest/**"
          if-no-files-found: warn
          retention-days: 14
