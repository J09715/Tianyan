name: Android APK 构建

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# 保留 concurrency，但 cancel-in-progress 关闭：
# 之前 fork 账号（免费 tier）一有并发的 workflow 排队，旧任务就被 cancel-in-progress 干掉，
# 导致永远 queued→cancelled。关掉它让后续构建排队等待而不是取消。
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    name: 打包 Debug APK (arm64)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install NDK 30.0.15729638 & CMake 3.22.1
        run: |
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMGR" ] || SDKMGR="$ANDROID_HOME/tools/bin/sdkmanager"
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" --install "ndk;30.0.15729638" "cmake;3.22.1" "platforms;android-37" "build-tools;37.0.0" | tail -1

      - name: Prepare PRoot ARM64 runtime
        run: |
          bash tools/prepare-proot-runtime.sh
          ls -la app/src/main/jniLibs/arm64-v8a/ | grep -E "libproot" || true

      - name: Rebuild libpty_native.so from source (JNI symbols must match current package)
        run: |
          set -euo pipefail
          NDK="$ANDROID_HOME/ndk/30.0.15729638"
          HOST_TAG="linux-x86_64"
          [ -d "$NDK/toolchains/llvm/prebuilt/$HOST_TAG" ] || HOST_TAG="$(ls "$NDK/toolchains/llvm/prebuilt" | head -1)"
          CC="$NDK/toolchains/llvm/prebuilt/$HOST_TAG/bin/aarch64-linux-android30-clang"
          [ -x "$CC" ] || { echo "clang not found: $CC"; exit 1; }
          SRC="app/src/main/cpp/pty_native.c"
          OUT="app/src/main/jniLibs/arm64-v8a/libpty_native.so"
          echo "  CC   : $CC"
          echo "  SRC  : $SRC"
          "$CC" -shared -fPIC -O2 -Wall -Werror=implicit-function-declaration -o "$OUT" "$SRC"
          echo "  -> rebuilt $OUT"
          ls -la "$OUT"
          # 校验：导出的 JNI 符号必须与当前包名一致（top_tianyan_app_runtime_pty）
          if ! "${NDK}/toolchains/llvm/prebuilt/$HOST_TAG/bin/llvm-nm" -D --defined-only "$OUT" \
               | grep -q "Java_top_tianyan_app_runtime_pty_NativePty_openAndExec"; then
            echo "!! 重建后的 .so 未导出 top_tianyan JNI 符号，JNI 将无法绑定"; exit 1
          fi
          if nm -D --defined-only "$OUT" 2>/dev/null | grep -q "top_wanxiang"; then
            echo "!! 重建后的 .so 仍含旧包名符号"; exit 1
          fi
          echo "  JNI 符号校验通过"

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --console=plain --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tianyan-debug-apk-${{ github.ref_name }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Attach APK to Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
          append_body: true
