<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>天衍 · 起始页</title>
<style>
  :root {
    --bg: #070b14;
    --panel: rgba(255, 255, 255, 0.045);
    --panel-border: rgba(255, 255, 255, 0.08);
    --text: #eaf0fb;
    --text-dim: #8b96ad;
    --text-faint: #5b657a;
    --accent: #3f8fff;
    --accent-soft: rgba(63, 143, 255, 0.16);
    --accent-glow: rgba(63, 143, 255, 0.35);
    --cyan: #22d3ee;
    --violet: #a78bfa;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body { height: 100%; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    user-select: none;
    -webkit-user-select: none;
  }

  /* ===== 背景：深色底 + 柔和光晕 + 细网格 ===== */
  .backdrop {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(1200px 700px at 18% -10%, rgba(63, 143, 255, 0.20), transparent 60%),
      radial-gradient(900px 600px at 105% 8%, rgba(167, 139, 250, 0.16), transparent 55%),
      radial-gradient(1000px 800px at 50% 118%, rgba(34, 211, 238, 0.12), transparent 60%),
      var(--bg);
    z-index: 0;
  }
  .backdrop::after {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: radial-gradient(ellipse 90% 70% at 50% 40%, #000 0%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse 90% 70% at 50% 40%, #000 0%, transparent 75%);
    pointer-events: none;
  }

  /* ===== 主布局 ===== */
  .stage {
    position: relative;
    z-index: 1;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 22px calc(24px + env(safe-area-inset-bottom));
    gap: 0;
  }

  /* ===== 品牌 ===== */
  .brand {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 34px;
    animation: rise 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  .logo {
    width: 54px; height: 54px;
    border-radius: 16px;
    background:
      radial-gradient(120% 120% at 25% 20%, rgba(255,255,255,0.28), transparent 45%),
      linear-gradient(145deg, var(--cyan), var(--accent) 55%, var(--violet));
    display: grid; place-items: center;
    box-shadow: 0 8px 28px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,0.35);
    position: relative;
  }
  .logo::after {
    content: "";
    position: absolute; inset: 2px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.25);
  }
  .logo svg { width: 30px; height: 30px; }
  .wordmark { display: flex; flex-direction: column; gap: 3px; }
  .wordmark h1 {
    font-size: 26px; font-weight: 700; letter-spacing: 1px;
    background: linear-gradient(90deg, #fff, #bcd4ff);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
  }
  .wordmark span {
    font-size: 11px; letter-spacing: 3px; color: var(--text-dim);
    text-transform: uppercase;
  }

  /* ===== 搜索框 ===== */
  .search {
    width: min(560px, 100%);
    margin-bottom: 30px;
    animation: rise 0.6s 0.08s cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  .search-box {
    display: flex; align-items: center; gap: 12px;
    padding: 15px 20px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 22px;
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255,255,255,0.06);
    transition: border-color 0.25s, box-shadow 0.25s, background 0.25s;
  }
  .search-box:focus-within {
    border-color: rgba(63, 143, 255, 0.65);
    background: rgba(255, 255, 255, 0.07);
    box-shadow: 0 12px 44px rgba(0, 0, 0, 0.42), 0 0 0 4px var(--accent-soft);
  }
  .search-box svg { width: 20px; height: 20px; flex: none; opacity: 0.65; }
  .search-box input {
    flex: 1; min-width: 0;
    background: transparent; border: none; outline: none;
    color: var(--text); font-size: 16px;
    caret-color: var(--accent);
  }
  .search-box input::placeholder { color: var(--text-faint); }
  .search-box button {
    flex: none;
    background: linear-gradient(135deg, var(--accent), #2f6fe0);
    color: #fff; border: none; cursor: pointer;
    padding: 8px 16px; border-radius: 13px;
    font-size: 13px; font-weight: 600; letter-spacing: 1px;
    box-shadow: 0 4px 16px var(--accent-glow);
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .search-box button:active { transform: scale(0.96); box-shadow: 0 2px 8px var(--accent-glow); }

  /* ===== 快捷站点 ===== */
  .quick {
    width: min(560px, 100%);
    animation: rise 0.6s 0.16s cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  .quick-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
  }
  .site {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    padding: 16px 6px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 18px;
    cursor: pointer;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    transition: transform 0.18s, background 0.18s, border-color 0.18s;
  }
  .site:active { transform: translateY(2px) scale(0.97); }
  .site:hover { background: rgba(255,255,255,0.075); border-color: rgba(255,255,255,0.16); }
  .site .tile {
    width: 46px; height: 46px; border-radius: 14px;
    display: grid; place-items: center;
    font-size: 20px; font-weight: 700; color: #fff;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.25), 0 6px 16px rgba(0,0,0,0.35);
  }
  .site .name { font-size: 12px; color: var(--text-dim); letter-spacing: 0.5px; }

  /* ===== 底部时钟 ===== */
  .foot {
    position: absolute;
    bottom: calc(20px + env(safe-area-inset-bottom));
    left: 0; right: 0;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    color: var(--text-faint);
    animation: rise 0.6s 0.24s cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  .clock { font-size: 13px; letter-spacing: 2px; font-variant-numeric: tabular-nums; color: var(--text-dim); }
  .foot small { font-size: 10px; letter-spacing: 1px; }

  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 380px) {
    .quick-grid { grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .site { padding: 12px 4px; }
    .site .tile { width: 40px; height: 40px; font-size: 18px; }
    .wordmark h1 { font-size: 22px; }
  }
</style>
</head>
<body>
  <div class="backdrop"></div>

  <div class="stage">
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M12 3a7 7 0 0 1 7 7v4a7 7 0 1 1-14 0v-4a7 7 0 0 1 7-7Z" stroke="#fff" stroke-width="1.7"/>
          <circle cx="12" cy="14" r="2.4" fill="#fff"/>
          <path d="M4 14a8 8 0 0 0 16 0" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="wordmark">
        <h1>天衍</h1>
        <span>Tianyan Browser</span>
      </div>
    </div>

    <div class="search">
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="#8b96ad" stroke-width="2" stroke-linecap="round">
          <circle cx="11" cy="11" r="7"/>
          <path d="m20 20-3.2-3.2"/>
        </svg>
        <input id="q" type="text" inputmode="url" autocomplete="off" autocapitalize="off"
               spellcheck="false" placeholder="搜索或输入网址" enterkeyhint="go">
        <button id="go">前往</button>
      </div>
    </div>

    <div class="quick">
      <div class="quick-grid" id="sites"></div>
    </div>

    <div class="foot">
      <div class="clock" id="clock">—</div>
      <small>天衍 · 内置浏览器起始页</small>
    </div>
  </div>

<script>
  var SITES = [
    { n: "GitHub",  c: "#24292f", u: "https://github.com" },
    { n: "Google",  c: "#4285f4", u: "https://www.google.com" },
    { n: "百度",     c: "#2932e1", u: "https://www.baidu.com" },
    { n: "必应",     c: "#0c8484", u: "https://www.bing.com" },
    { n: "Stack",   c: "#f48024", u: "https://stackoverflow.com" },
    { n: "MDN",     c: "#000",    u: "https://developer.mozilla.org" },
    { n: "知乎",     c: "#0e6dff", u: "https://www.zhihu.com" },
    { n: "B站",      c: "#fb7299", u: "https://www.bilibili.com" }
  ];

  var grid = document.getElementById("sites");
  SITES.forEach(function (s) {
    var el = document.createElement("div");
    el.className = "site";
    el.innerHTML =
      '<div class="tile" style="background:linear-gradient(150deg,' + s.c + ',' + s.c + 'cc)">' +
      s.n.charAt(0) + '</div>' +
      '<div class="name">' + s.n + '</div>';
    el.addEventListener("click", function () { window.location.href = s.u; });
    grid.appendChild(el);
  });

  function isUrlLike(v) {
    if (/^https?:\/\//i.test(v)) return true;
    return /^([a-z0-9]([a-z0-9-]*[a-z0-9])?\.)+[a-z]{2,}(:\d+)?([\/?#].*)?$/i.test(v);
  }

  function go() {
    var v = document.getElementById("q").value.trim();
    if (!v) return;
    if (isUrlLike(v)) {
      var url = /^https?:\/\//i.test(v) ? v : "https://" + v;
      window.location.href = url;
    } else {
      window.location.href = "https://www.bing.com/search?q=" + encodeURIComponent(v);
    }
  }

  document.getElementById("go").addEventListener("click", go);
  document.getElementById("q").addEventListener("keydown", function (e) {
    if (e.key === "Enter") go();
  });

  function tick() {
    var d = new Date();
    var p = function (n) { return (n < 10 ? "0" : "") + n; };
    var week = ["日", "一", "二", "三", "四", "五", "六"][d.getDay()];
    document.getElementById("clock").textContent =
      d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) +
      " 星期" + week + "  " + p(d.getHours()) + ":" + p(d.getMinutes());
  }
  tick();
  setInterval(tick, 1000);

  // 页面就绪后自动聚焦搜索框（移动端软键盘按需弹出，避免一进来就弹键盘）
  window.addEventListener("load", function () {
    setTimeout(function () { document.getElementById("q").focus(); }, 120);
  });
</script>
</body>
</html>
