[versions]
ktorServer = "3.6.0"
androidxWebkit = "1.17.1"
agp = "9.4.1"
kotlin = "2.4.21"
ksp = "2.3.12"
hilt = "2.60.1"
composeBom = "2026.09.00"
# material3 单独定版：BOM 2026.09.00 锁定的是 1.4.0，而 M3 Expressive 的
# ButtonGroup / SplitButton / LoadingIndicator / ToggleButton / FloatingToolbar
# 只在 1.5.0-beta01 起存在（1.4.0 的 aar 里这些类一个都没有）。
# 覆盖 BOM 是本仓库唯一能拿到 Expressive 组件的路径，代价是吃 beta 期 API 漂移；
# 因此所有屏只允许经由 feature/components 的 Runtime* 包装使用这些组件，
# 升级或回退时只改包装层，不触碰业务屏。
material3 = "1.5.0-beta01"
activityCompose = "1.13.0"
leakcanaryAndroid = "2.14"
lifecycle = "2.11.0"
navigation3 = "1.2.0"
hiltNavigationCompose = "1.4.0"
room = "2.8.5"
datastore = "1.2.1"
okhttp = "5.5.0"
ktor = "3.6.0"
kotlinxSerializationJson = "1.12.0"
coroutines = "1.11.0"
coreKtx = "1.19.1"
appcompat = "1.8.0"
junit = "4.13.2"
jsch = "0.2.21"
xz = "1.12"
zstd = "1.5.7-24"
shizuku = "13.1.5"
hiddenApiBypass = "6.2"
kadb = "2.1.5"
androidxJunit = "1.3.0"
espressoCore = "3.7.0"
robolectric = "4.17"
androidxTestCore = "1.7.0"
# AndroidLiquidGlass (Kyant0) — Compose 液态玻璃效果库，澄明主题的渲染核心
backdrop = "2.0.1"
coil = "3.6.3"
coreSplashscreen = "1.2.0"
# Baseline Profile：启动时预编译热点方法，治首次冷启动 JIT 现场编译慢
baselineprofile = "1.5.0"
profileinstaller = "1.4.1"
uiautomator = "2.4.0"

[libraries]
ktor-server-core = { group = "io.ktor", name = "ktor-server-core", version.ref = "ktorServer" }
ktor-server-netty = { group = "io.ktor", name = "ktor-server-netty", version.ref = "ktorServer" }
ktor-server-cio = { group = "io.ktor", name = "ktor-server-cio", version.ref = "ktorServer" }
ktor-server-sse = { group = "io.ktor", name = "ktor-server-sse", version.ref = "ktorServer" }
ktor-server-status-pages = { group = "io.ktor", name = "ktor-server-status-pages", version.ref = "ktorServer" }
ktor-sse = { group = "io.ktor", name = "ktor-sse", version.ref = "ktorServer" }
androidx-webkit = { group = "androidx.webkit", name = "webkit", version.ref = "androidxWebkit" }
hiddenapi-bypass = { group = "org.lsposed.hiddenapibypass", name = "hiddenapibypass", version.ref = "hiddenApiBypass" }
leakcanary-android = { module = "com.squareup.leakcanary:leakcanary-android", version.ref = "leakcanaryAndroid" }
shizuku-api = { group = "dev.rikka.shizuku", name = "api", version.ref = "shizuku" }
shizuku-provider = { group = "dev.rikka.shizuku", name = "provider", version.ref = "shizuku" }
kadb = { group = "com.flyfishxu", name = "kadb", version.ref = "kadb" }
kadb-mdns = { group = "com.flyfishxu", name = "kadb-mdns", version.ref = "kadb" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplashscreen" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
# 动效令牌（Motion.kt）直接依赖：虽然 material3 → foundation → animation 会
# api 传递 animation-core，但令牌文件是本仓的公共契约，不应依赖传递路径。
androidx-compose-animation-core = { group = "androidx.compose.animation", name = "animation-core" }
# 展开/收起容器（AnimatedVisibility / expandVertically）需要完整 animation 包；
# animation-core 只提供动画规格类型。空态/错误态的技术详情折叠走这条依赖。
androidx-compose-animation = { group = "androidx.compose.animation", name = "animation" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
# 显式 version.ref 覆盖 BOM 锁定：见 [versions].material3 的说明
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation3-runtime = { group = "androidx.navigation3", name = "navigation3-runtime", version.ref = "navigation3" }
androidx-navigation3-ui = { group = "androidx.navigation3", name = "navigation3-ui", version.ref = "navigation3" }
androidx-lifecycle-viewmodel-navigation3 = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-navigation3", version.ref = "lifecycle" }
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "okhttp" }
ktor-client-core = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { group = "io.ktor", name = "ktor-client-okhttp", version.ref = "ktor" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
jsch = { group = "com.github.mwiede", name = "jsch", version.ref = "jsch" }
xz = { group = "org.tukaani", name = "xz", version.ref = "xz" }
zstd = { group = "com.github.luben", name = "zstd-jni", version.ref = "zstd" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxJunit" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }
androidx-room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }
# Robolectric 内置 ASM 不支持 Java 25（class file 69）；测试类路径强制升级 ASM 系列到 9.9.1
asm = { group = "org.ow2.asm", name = "asm", version = "9.9.1" }
asm-commons = { group = "org.ow2.asm", name = "asm-commons", version = "9.9.1" }
asm-util = { group = "org.ow2.asm", name = "asm-util", version = "9.9.1" }
asm-tree = { group = "org.ow2.asm", name = "asm-tree", version = "9.9.1" }
asm-analysis = { group = "org.ow2.asm", name = "asm-analysis", version = "9.9.1" }
# Baseline Profile 生成与安装
androidx-benchmark-macro-junit4 = { group = "androidx.benchmark", name = "benchmark-macro-junit4", version.ref = "baselineprofile" }
androidx-profileinstaller = { group = "androidx.profileinstaller", name = "profileinstaller", version.ref = "profileinstaller" }
androidx-test-uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator", version.ref = "uiautomator" }
backdrop = { group = "io.github.kyant0", name = "backdrop", version.ref = "backdrop" }
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-test = { id = "com.android.test", version.ref = "agp" }
androidx-baselineprofile = { id = "androidx.baselineprofile", version.ref = "baselineprofile" }
kandroid = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
