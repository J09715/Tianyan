[versions]
koin = "4.2.2"
ktorServer = "3.6.0"
androidxWebkit = "1.17.1"
agp = "9.4.1"
kotlin = "2.4.21"
ksp = "2.3.11"
composeBom = "2026.09.00"
# BOM 2026.09.00 钉的是 material3 稳定版 1.4.0，拿不到 LoadingIndicator / 波浪进度 /
# ButtonGroup / MaterialShapes 等 M3 Expressive 组件，这里显式抬版（直接版本优先于 BOM 约束）
material3 = "1.5.0-beta01"
# 官方 HCT/Monet 取色算法的 KMP 移植：壁纸种子派生方案与语义色谐调（Apache-2.0）
materialColorUtilities = "6.0.0"
activityCompose = "1.13.0"
leakcanaryAndroid = "2.14"
lifecycle = "2.11.0"
navigation3 = "1.2.0"
# miuix Navigation3 UI：androidx.navigation3.ui.NavDisplay 的 MIUI/HyperOS 风格替换，
# 默认转场即侧滑动画（视差滑动+圆角裁切+遮罩+转场期输入阻断），无需自定义 transitionSpec
miuix = "0.9.3"
room = "2.8.5"
datastore = "1.2.1"
okhttp = "5.5.0"
ktor = "3.6.0"
kotlinxSerializationJson = "1.11.0"
coroutines = "1.11.0"
coreKtx = "1.19.1"
annotationExperimental = "1.5.1"
appcompat = "1.8.0"
junit = "4.13.2"
xz = "1.12"
zstd = "1.5.7-23"
shizuku = "13.1.5"
hiddenApiBypass = "6.2"
kadb = "2.1.4"
androidxJunit = "1.3.0"
robolectric = "4.17"
androidxTestCore = "1.7.0"
coil = "3.6.3"
coreSplashscreen = "1.2.0"
# Baseline Profile：启动时预编译热点方法，治首次冷启动 JIT 现场编译慢
baselineprofile = "1.5.0"
profileinstaller = "1.4.1"
uiautomator = "2.4.0"
# JGit（MGit 同源技术栈）：宿主侧直接管理工作区 Git 仓库，无需沙箱 git
jgit = "6.10.1.202505221210-r"
# A2UI（Agent-to-UI）：智能体以 JSON Lines 描述界面、客户端渲染原生 Compose 组件的官方协议实现
a2ui = "1.0.0-alpha01"
# Media3：A2UI Video / AudioPlayer 的原生播放器（控件与拖动进度）
media3 = "1.11.1"
termux = "0.118.0"
# WorkManager：工作流定时计划的到点触发（进程被杀也能拉起）；周期最小 15 分钟、Doze 下允许分钟级延迟
work = "2.12.0"
mlkitTranslate = "17.0.3"
asm = "9.11"
# Rhino：codemode 脚本引擎（MPL-2.0，与 GPL-3.0 兼容）；Android 上必须用解释模式
rhino = "1.9.1"

[libraries]
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
androidx-work-testing = { module = "androidx.work:work-testing", version.ref = "work" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }
koin-workmanager = { module = "io.insert-koin:koin-androidx-workmanager", version.ref = "koin" }
koin-test = { module = "io.insert-koin:koin-test", version.ref = "koin" }
ktor-server-core = { group = "io.ktor", name = "ktor-server-core", version.ref = "ktorServer" }
ktor-server-cio = { group = "io.ktor", name = "ktor-server-cio", version.ref = "ktorServer" }
androidx-webkit = { group = "androidx.webkit", name = "webkit", version.ref = "androidxWebkit" }
hiddenapi-bypass = { group = "org.lsposed.hiddenapibypass", name = "hiddenapibypass", version.ref = "hiddenApiBypass" }
leakcanary-android = { module = "com.squareup.leakcanary:leakcanary-android", version.ref = "leakcanaryAndroid" }
shizuku-api = { group = "dev.rikka.shizuku", name = "api", version.ref = "shizuku" }
shizuku-provider = { group = "dev.rikka.shizuku", name = "provider", version.ref = "shizuku" }
kadb = { group = "com.flyfishxu", name = "kadb", version.ref = "kadb" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplashscreen" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
material-color-utilities = { module = "com.materialkolor:material-color-utilities", version.ref = "materialColorUtilities" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-navigation3-runtime = { group = "androidx.navigation3", name = "navigation3-runtime", version.ref = "navigation3" }
miuix-navigation3-ui = { module = "top.yukonga.miuix.kmp:miuix-navigation3-ui-android", version.ref = "miuix" }
androidx-lifecycle-viewmodel-navigation3 = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-navigation3", version.ref = "lifecycle" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "okhttp" }
ktor-client-core = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { group = "io.ktor", name = "ktor-client-okhttp", version.ref = "ktor" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
xz = { group = "org.tukaani", name = "xz", version.ref = "xz" }
zstd = { group = "com.github.luben", name = "zstd-jni", version.ref = "zstd" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxJunit" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }
androidx-room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }
# Robolectric 内置 ASM 不支持 Java 25（class file 69）；测试类路径强制升级 ASM 系列到 9.9.1
asm = { group = "org.ow2.asm", name = "asm", version.ref = "asm" }
asm-commons = { group = "org.ow2.asm", name = "asm-commons", version.ref = "asm" }
asm-util = { group = "org.ow2.asm", name = "asm-util", version.ref = "asm" }
asm-tree = { group = "org.ow2.asm", name = "asm-tree", version.ref = "asm" }
asm-analysis = { group = "org.ow2.asm", name = "asm-analysis", version.ref = "asm" }
# Baseline Profile 生成与安装
androidx-benchmark-macro-junit4 = { group = "androidx.benchmark", name = "benchmark-macro-junit4", version.ref = "baselineprofile" }
androidx-profileinstaller = { group = "androidx.profileinstaller", name = "profileinstaller", version.ref = "profileinstaller" }
androidx-test-uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator", version.ref = "uiautomator" }
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }
jgit = { group = "org.eclipse.jgit", name = "org.eclipse.jgit", version.ref = "jgit" }
a2ui-model = { group = "androidx.a2ui", name = "a2ui-model", version.ref = "a2ui" }
a2ui-compose-runtime = { group = "androidx.a2ui.compose", name = "compose-runtime", version.ref = "a2ui" }
a2ui-compose-ui = { group = "androidx.a2ui.compose", name = "compose-ui", version.ref = "a2ui" }
a2ui-material3 = { group = "androidx.compose.material3", name = "material3-a2ui", version.ref = "a2ui" }
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
termux-terminal-view = { group = "com.termux", name = "terminal-view", version.ref = "termux" }
mlkit-translate = { group = "com.google.mlkit", name = "translate", version.ref = "mlkitTranslate" }
rhino = { group = "org.mozilla", name = "rhino", version.ref = "rhino" }

# Dependencies of the included build-logic
android-gradlePlugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
kotlin-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
ksp-gradlePlugin = { group = "com.google.devtools.ksp", name = "com.google.devtools.ksp.gradle.plugin", version.ref = "ksp" }
compose-gradlePlugin = { group = "org.jetbrains.kotlin", name = "compose-compiler-gradle-plugin", version.ref = "kotlin" }

[bundles]
compose-ui = [
    "androidx-compose-ui",
    "androidx-compose-ui-graphics",
    "androidx-compose-material3",
]
koin-compose = [
    "koin-android",
    "koin-compose-viewmodel",
]
coil = [
    "coil-compose",
    "coil-network-okhttp",
]
room = [
    "androidx-room-runtime",
    "androidx-room-ktx",
]
asm-test = [
    "asm",
    "asm-commons",
    "asm-util",
    "asm-tree",
    "asm-analysis",
]
test-robolectric = [
    "junit",
    "robolectric",
    "androidx-test-core",
]
ktor-server = [
    "ktor-server-core",
    "ktor-server-cio",
]
ktor-client = [
    "ktor-client-core",
    "ktor-client-okhttp",
]
shizuku = [
    "shizuku-api",
    "shizuku-provider",
]
navigation3 = [
    "androidx-navigation3-runtime",
    "miuix-navigation3-ui",
    "androidx-lifecycle-viewmodel-navigation3",
]
baselineprofile-test = [
    "androidx-benchmark-macro-junit4",
    "androidx-test-uiautomator",
    "androidx-junit",
]
coroutines = [
    "kotlinx-coroutines-core",
    "kotlinx-coroutines-android",
]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-test = { id = "com.android.test", version.ref = "agp" }
androidx-baselineprofile = { id = "androidx.baselineprofile", version.ref = "baselineprofile" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

# Convention plugins defined by build-logic
tianyan-android-application = { id = "tianyan.android.application" }
tianyan-android-application-compose = { id = "tianyan.android.application.compose" }
tianyan-android-library = { id = "tianyan.android.library" }
tianyan-android-library-compose = { id = "tianyan.android.library.compose" }
tianyan-android-feature = { id = "tianyan.android.feature" }
tianyan-android-room = { id = "tianyan.android.room" }
tianyan-jvm-library = { id = "tianyan.jvm.library" }
